version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: igen-architect-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-Admin123456}
      MONGO_INITDB_DATABASE: igen-architect
    volumes:
      - mongo_data:/data/db
    networks:
      - igen_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  igen-architect:
    build: .
    container_name: igen-architect-app
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-Admin123456}@mongodb:27017/igen-architect?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - igen_network

  nginx:
    image: nginx:alpine
    container_name: igen-architect-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - igen-architect
    networks:
      - igen_network

volumes:
  mongo_data:

networks:
  igen_network:
    driver: bridge
