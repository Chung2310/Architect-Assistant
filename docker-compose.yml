version: '3.8'

services:
  architect-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: architect-assistant
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - .env
    volumes:
      - .env:/app/.env
    networks:
      - default_network
networks:
  default_network:
    external: true
