version: '3.8'

services:
  architect-assistant:
    image: ghcr.io/chung2310/architect-assistant:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-architect-assistant}
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - .env
    volumes:
      - .env:/app/.env
    networks:
      - default_network

networks:
  default_network:
    external: true
